<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF6EF"/>
      <stop offset="100%" stop-color="#F3EDE3"/>
    </linearGradient>
  </defs>

  <rect width="700" height="300" fill="url(#bg1)"/>

  <!-- Subtle grid -->
  <g stroke="#2C2A22" stroke-width="0.4" opacity="0.045">
    <line x1="0" y1="60" x2="700" y2="60"/>
    <line x1="0" y1="120" x2="700" y2="120"/>
    <line x1="0" y1="180" x2="700" y2="180"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
  </g>

  <!-- Abstract rising bars -->
  <g opacity="0.065" fill="#7B7B56">
    <rect x="80" y="160" width="50" height="140" rx="4"/>
    <rect x="150" y="120" width="50" height="180" rx="4"/>
    <rect x="220" y="90" width="50" height="210" rx="4"/>
    <rect x="290" y="110" width="50" height="190" rx="4"/>
    <rect x="360" y="60" width="50" height="240" rx="4"/>
    <rect x="430" y="40" width="50" height="260" rx="4"/>
    <rect x="500" y="70" width="50" height="230" rx="4"/>
    <rect x="570" y="20" width="50" height="280" rx="4"/>
  </g>

  <!-- Upward trend line + area -->
  <polygon points="60,230 140,200 220,175 300,185 380,140 460,110 540,125 620,70 620,300 60,300"
    fill="#7B7B56" opacity="0.03"/>
  <polyline points="60,230 140,200 220,175 300,185 380,140 460,110 540,125 620,70"
    fill="none" stroke="#7B7B56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
  <g fill="#A49A6E" opacity="0.14">
    <circle cx="60" cy="230" r="4.5"/><circle cx="140" cy="200" r="4.5"/>
    <circle cx="220" cy="175" r="4.5"/><circle cx="300" cy="185" r="4.5"/>
    <circle cx="380" cy="140" r="4.5"/><circle cx="460" cy="110" r="4.5"/>
    <circle cx="540" cy="125" r="4.5"/><circle cx="620" cy="70" r="5.5"/>
  </g>

  <!-- Floating $ signs -->
  <g fill="#2C2A22" font-family="Georgia, serif" opacity="0.035" font-weight="700">
    <text x="50" y="80" font-size="60">$</text>
    <text x="320" y="55" font-size="45">$</text>
    <text x="590" y="270" font-size="80">$</text>
    <text x="160" y="275" font-size="35">$</text>
    <text x="480" y="50" font-size="50">$</text>
  </g>

  <!-- Donut ring hint top-right -->
  <circle cx="610" cy="90" r="38" fill="none" stroke="#C0A07A" stroke-width="8" opacity="0.07"/>
  <circle cx="610" cy="90" r="38" fill="none" stroke="#7B7B56" stroke-width="8" opacity="0.07"
    stroke-dasharray="80 160" stroke-dashoffset="0"/>

  <!-- Ghost card outlines -->
  <rect x="28" y="28" width="88" height="52" rx="8" fill="none" stroke="#7B7B56" stroke-width="1.2" opacity="0.055"/>
  <rect x="445" y="198" width="78" height="48" rx="8" fill="none" stroke="#C0A07A" stroke-width="1.2" opacity="0.055"/>

  <!-- Mini sparklines inside ghost cards -->
  <path d="M34,54 Q48,40 58,54 Q68,68 78,48 Q88,36 104,50" fill="none" stroke="#7B7B56" stroke-width="1" opacity="0.09"/>
  <path d="M451,222 Q464,210 474,222 Q484,234 494,214 Q504,202 515,218" fill="none" stroke="#C0A07A" stroke-width="1" opacity="0.09"/>

  <!-- Faint data text -->
  <g font-family="monospace" opacity="0.035" fill="#2C2A22">
    <text x="128" y="42" font-size="16">+12.4%</text>
    <text x="395" y="274" font-size="13">$47,280</text>
  </g>
</svg>